<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        The Lab
        {% endblock %}
    </title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            font-family: Arial, sans-serif;
        }

        /* SIDEBAR */

        .sidebar {
            width: 240px;
            min-height: 100vh;
            padding: 25px 15px;
            border-right: 1px solid #ddd;
            background: #fafafa;

            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            margin-bottom: 40px;
        }

        .sidebar-logo {
            font-size: 18px;
            font-weight: 700;
        }

        .sidebar-logo span {
            font-size: 12px;
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;

            padding: 12px;
            border-radius: 7px;

            color: #333;
            text-decoration: none;

            transition: 0.2s;
        }

        .nav-item:hover {
            background: #eaeaea;
        }

        .nav-item svg,
        .logout-btn svg {
            width: 20px;
            height: 20px;
        }

        /* LOGOUT */

        .logout-form {
            margin-top: auto;
        }

        .logout-btn {
            width: 100%;

            display: flex;
            align-items: center;
            gap: 12px;

            padding: 12px;

            border: none;
            border-radius: 7px;

            background: transparent;
            color: #333;

            cursor: pointer;
            font-size: 15px;

            text-align: left;
        }

        .logout-btn:hover {
            background: #eaeaea;
        }


        /* MAIN CONTENT */

        .main-content {
            flex: 1;
            padding: 40px;
        }

    </style>

</head>


<body>


    <!-- =========================
         SIDEBAR
         ========================= -->

    <aside class="sidebar">

        <div class="sidebar-header">

            <div class="sidebar-logo">
                <span>●</span> Hey Kid sup!!
            </div>

        </div>


        <nav class="nav-links">

            <!-- Profile -->

            <a href="{% url 'home' %}"
               class="nav-item">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round"
                     stroke-linejoin="round">

                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>

                    <polyline points="9 22 9 12 15 12 15 22"></polyline>

                </svg>

                Profile

            </a>


            <!-- Lab Practical -->

            <a href="{% url 'lab_practical' %}"
               class="nav-item">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round"
                     stroke-linejoin="round">

                    <circle cx="12"
                            cy="12"
                            r="10"></circle>

                    <path d="M12 16v-4"></path>

                    <path d="M12 8h.01"></path>

                </svg>

                Lab Practical

            </a>

        </nav>


        <!-- LOGOUT -->

        <form method="post"
              action="{% url 'logout' %}"
              class="logout-form">

            {% csrf_token %}

            <button type="submit"
                    class="logout-btn">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round"
                     stroke-linejoin="round">

                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>

                    <polyline points="16 17 21 12 16 7"></polyline>

                    <line x1="21"
                          y1="12"
                          x2="9"
                          y2="12"></line>

                </svg>

                Log out

            </button>

        </form>

    </aside>


    <!-- =========================
         PAGE CONTENT
         ========================= -->

    <main class="main-content">

        {% block content %}

        {% endblock %}

    </main>


</body>

</html>
