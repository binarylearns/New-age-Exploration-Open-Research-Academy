{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🔤 Letter Play — Class 1</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Fredoka', sans-serif; }
    @keyframes pop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .letter-pop { animation: pop 0.3s ease-out; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }
    .float { animation: float 3s ease-in-out infinite; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-pink-200 via-purple-100 to-blue-200 overflow-hidden">

  <!-- ===== HEADER BAR ===== -->
  <header class="flex items-center justify-between px-4 md:px-8 py-4">
    <!-- Back button -->
    <a href="{% url 'class_tasks' %}"
       class="bg-white hover:bg-gray-100 text-purple-600 font-bold py-2 px-4 rounded-full shadow-md flex items-center gap-2 transition">
      <span class="text-xl">⬅️</span> <span class="hidden sm:inline">Back</span>
    </a>

    <!-- Title -->
    <h1 class="text-2xl md:text-3xl font-bold text-purple-700 drop-shadow">
      🔤 Letter Play
    </h1>

    <!-- Score + Timer + Hearts -->
    <div class="flex gap-2 md:gap-3">
      <div class="bg-white rounded-full px-4 py-2 shadow-md flex items-center gap-2">
        <span class="text-xl">⭐</span>
        <span class="font-bold text-purple-600" id="score">0</span>
      </div>
      <div class="bg-white rounded-full px-4 py-2 shadow-md flex items-center gap-2">
        <span class="text-xl">⏱️</span>
        <span class="font-bold text-pink-500" id="timer">60</span>
      </div>
      <div class="bg-white rounded-full px-4 py-2 shadow-md flex items-center gap-2">
        <span class="text-xl" id="hearts">❤️❤️❤️</span>
      </div>
    </div>
  </header>

  <!-- ===== LANGUAGE TOGGLE ===== -->
  <div class="flex justify-center gap-3 mb-4">
    <button id="btnEnglish"
      class="lang-btn bg-purple-500 text-white font-bold py-2 px-6 rounded-full shadow-md transition">
      A B C (English)
    </button>
    <button id="btnNepali"
      class="lang-btn bg-white text-purple-600 font-bold py-2 px-6 rounded-full shadow-md transition">
      क ख ग (नेपाली)
    </button>
  </div>

  <!-- ===== PLAY AREA ===== -->
  <main class="relative max-w-5xl mx-auto h-[60vh] md:h-[65vh] mx-4 md:mx-auto">

    <!-- Falling letter spawn zone (EMPTY — JS spawns letters here) -->
    <div id="playArea"
      class="relative w-full h-full bg-white/40 backdrop-blur-sm rounded-3xl border-4 border-dashed border-purple-300 shadow-inner overflow-hidden">

      <!-- Hint text (visible when empty) -->
      <p id="hintText" class="absolute inset-0 flex items-center justify-center text-purple-400 font-bold text-lg md:text-2xl text-center px-4 pointer-events-none">
        Press the letter key to catch it! ⌨️
      </p>

    </div>

    <!-- ===== VIRTUAL KEYBOARD ===== -->
    <div id="keyboard" class="mt-4 grid grid-cols-7 md:grid-cols-13 gap-1 md:gap-2 max-w-4xl mx-auto px-2"></div>

  </main>

  <!-- ===== BOTTOM ACTION BAR ===== -->
  <footer class="fixed bottom-0 inset-x-0 bg-white/80 backdrop-blur-md border-t-2 border-purple-200 py-3 px-4 flex justify-center gap-3">
    <button id="btnStart"
      class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-8 rounded-full shadow-lg text-lg transition">
      ▶️ Start Game
    </button>
    <button id="btnPause"
      class="bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 px-8 rounded-full shadow-lg text-lg transition hidden">
      ⏸️ Pause
    </button>
    <button id="btnReset"
      class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-8 rounded-full shadow-lg text-lg transition hidden">
      🔄 Reset
    </button>
  </footer>

  <!-- ===== GAME OVER MODAL ===== -->
  <div id="gameOverModal"
    class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-3xl shadow-2xl p-8 md:p-12 text-center max-w-md w-full letter-pop">
      <div class="text-7xl mb-4">🎉</div>
      <h2 class="text-3xl md:text-4xl font-bold text-purple-700 mb-2">Great Job!</h2>
      <p class="text-gray-500 mb-6">You caught letters!</p>
      <div class="bg-purple-100 rounded-2xl py-4 mb-6">
        <p class="text-sm text-purple-500 font-semibold">YOUR SCORE</p>
        <p class="text-5xl font-bold text-purple-700" id="finalScore">0</p>
      </div>
      <button id="btnPlayAgain"
        class="bg-purple-500 hover:bg-purple-600 text-white font-bold py-3 px-8 rounded-full shadow-lg text-lg transition">
        🔁 Play Again
      </button>
    </div>
  </div>

  <!-- ===== GAME LOGIC (external) ===== -->
  <script src="{% static 'accounts/js/letter_play.js' %}"></script>
</body>
</html>
