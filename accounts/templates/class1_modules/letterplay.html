{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🔤 Letter Play — Class 1</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Fredoka', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    h1, h2, .title-font { font-family: 'Baloo 2', cursive; }

    /* Fun letter pop when caught */
    @keyframes pop {
      0%   { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1);   opacity: 1; }
    }
    .letter-pop { animation: pop 0.3s ease-out; }

    /* Gentle float for decorations */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-12px); }
    }
    .float { animation: float 3s ease-in-out infinite; }

    /* Animated background gradient */
    @keyframes bgShift {
      0%   { background-position:   0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position:   0% 50%; }
    }
    body {
      background: linear-gradient(-45deg,
        #ffd6ec, #e7d8ff, #d8ecff, #d6f9e4, #fff5cc);
      background-size: 400% 400%;
      animation: bgShift 18s ease infinite;
    }

    /* Soft floating bubbles in the background */
    .bubble {
      position: fixed;
      border-radius: 9999px;
      filter: blur(2px);
      opacity: 0.45;
      pointer-events: none;
      z-index: 0;
      animation: bubbleFloat linear infinite;
    }
    @keyframes bubbleFloat {
      0%   { transform: translateY(110vh) scale(0.6); }
      100% { transform: translateY(-20vh) scale(1.1); }
    }

    /* Wobble on buttons when hovered */
    @keyframes wobble {
      0%, 100% { transform: rotate(0); }
      25%      { transform: rotate(-4deg); }
      75%      { transform: rotate(4deg); }
    }
    .btn-fun:hover { animation: wobble 0.4s ease-in-out; }

    /* Bounce-in for the modal */
    @keyframes bounceIn {
      0%   { transform: scale(0.6); opacity: 0; }
      60%  { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .modal-bounce { animation: bounceIn 0.45s ease-out; }

    /* Play area animated gradient */
    #playArea {
      background: linear-gradient(135deg,
        rgba(255, 214, 236, 0.55),
        rgba(231, 216, 255, 0.55),
        rgba(216, 236, 255, 0.55),
        rgba(214, 249, 228, 0.55));
      background-size: 300% 300%;
      animation: bgShift 12s ease infinite;
    }

    /* Falling letters above background orbs */
    .falling-letter { z-index: 10; }

    /* Combo HUD pop (used by JS) */
    .combo-pop { animation: pop 0.3s ease-out; }

    /* Combo floating popup (used by JS) */
    @keyframes comboFloat {
      0%   { opacity: 0; transform: translate(-50%, 0)     scale(0.5); }
      20%  { opacity: 1; transform: translate(-50%, -12px) scale(1.2); }
      100% { opacity: 0; transform: translate(-50%, -80px) scale(1); }
    }

    /* Hide the virtual keyboard (letters will be typed on real keyboard) */
    #keyboard { display: none; }

    /* Mobile tweak: keep footer clear of content */
    footer { padding-bottom: calc(0.75rem + env(safe-area-inset-bottom)); }
  </style>
</head>
<body class="min-h-screen overflow-hidden relative">

  <!-- ===== DECORATIVE BACKGROUND BUBBLES ===== -->
  <div class="bubble" style="width:90px;  height:90px;  left:8%;   background:#ffb6d5; animation-duration:16s; animation-delay:-2s;"></div>
  <div class="bubble" style="width:60px;  height:60px;  left:22%;  background:#c9b8ff; animation-duration:22s; animation-delay:-8s;"></div>
  <div class="bubble" style="width:120px; height:120px; left:45%;  background:#a5d8ff; animation-duration:20s; animation-delay:-12s;"></div>
  <div class="bubble" style="width:70px;  height:70px;  left:65%;  background:#b6f0c9; animation-duration:18s; animation-delay:-4s;"></div>
  <div class="bubble" style="width:100px; height:100px; left:85%;  background:#ffe08a; animation-duration:24s; animation-delay:-10s;"></div>

  <!-- ===== HEADER BAR ===== -->
  <header class="relative z-10 flex items-center justify-between gap-3 px-4 md:px-8 py-4">

    <!-- Back button -->
    <a href="{% url 'class_tasks' %}"
       class="btn-fun bg-white hover:bg-purple-50 text-purple-600 font-bold py-2.5 px-4 rounded-full shadow-md flex items-center gap-2 transition border-2 border-purple-200">
      <span class="text-xl">⬅️</span>
      <span class="hidden sm:inline">Back</span>
    </a>

    <!-- Title -->
    <h1 class="title-font text-2xl md:text-4xl font-extrabold text-purple-700 drop-shadow-sm whitespace-nowrap">
      🔤 Letter Play
    </h1>

      <!--  Player's Name -->
 

<h2 class="text-2xl font-bold tracking-tight text-gray-800">
    Welcome, <span class="text-indigo-600">{{ request.user.username }}</span>!
</h2>



    <!-- Player display (logged-in user, filled by JS) -->
    <div id="playerDisplay"
         class="hidden bg-white/90 backdrop-blur rounded-full px-4 py-2 shadow-md text-sm md:text-base font-bold text-purple-700 border-2 border-purple-200">
    </div>

    <!-- Score + Timer + Hearts -->
    <div class="flex gap-2 md:gap-3">
      <div class="bg-white rounded-full px-3 md:px-4 py-2 shadow-md flex items-center gap-2 border-2 border-yellow-200">
        <span class="text-xl">⭐</span>
        <span class="font-extrabold text-purple-700 text-lg" id="score">0</span>
      </div>
      <div class="bg-white rounded-full px-3 md:px-4 py-2 shadow-md flex items-center gap-2 border-2 border-pink-200">
        <span class="text-xl">⏱️</span>
        <span class="font-extrabold text-pink-500 text-lg" id="timer">60</span>
      </div>
      <div class="bg-white rounded-full px-3 md:px-4 py-2 shadow-md flex items-center gap-2 border-2 border-red-200">
        <span class="text-xl" id="hearts">❤️❤️❤️</span>
      </div>
      <!-- Combo pill -->
      <div class="bg-white rounded-full px-3 md:px-4 py-2 shadow-md flex flex-col items-center justify-center border-2 border-orange-200 leading-none">
        <span class="text-[10px] uppercase tracking-wide text-orange-400 font-bold">Combo</span>
        <span id="comboValue" class="text-lg font-extrabold text-orange-500">0</span>
      </div>
    </div>
  </header>

  <!-- ===== LANGUAGE TOGGLE ===== -->

<div class="flex justify-center gap-3 mb-4 px-4">
    <button id="btnEnglish"
        class="lang-btn rounded-full bg-blue-600 px-6 py-2.5 font-bold text-white shadow-md transition hover:bg-white hover:text-black hover:scale-105">
        A B C (English)
    </button>

    <button id="btnNepali"
        class="lang-btn rounded-full border-2 border-blue-500 bg-white px-6 py-2.5 font-bold text-blue-600 shadow-sm transition hover:bg-white hover:text-black hover:scale-105">
        क ख ग (नेपाली)
    </button>
</div>


  <!-- ===== PLAY AREA ===== -->
  <main class="relative z-10 max-w-5xl mx-auto h-[55vh] md:h-[62vh] mx-4 md:mx-auto">

    <div id="playArea"
      class="relative w-full h-full rounded-[2rem] border-4 border-dashed border-purple-300 shadow-xl overflow-hidden">

      <!-- Hint text (visible when empty) -->
      <p id="hintText"
         class="absolute inset-0 flex flex-col items-center justify-center text-purple-500 font-extrabold text-lg md:text-2xl text-center px-4 pointer-events-none">
        <span class="text-5xl md:text-6xl mb-2 float">⌨️</span>
        <span>Press the letter key to catch it!</span>
      </p>

    </div>

    <!-- Virtual keyboard (hidden — kids type on real keyboard) -->
    <div id="keyboard" class="mt-4 grid grid-cols-7 md:grid-cols-13 gap-1 md:gap-2 max-w-4xl mx-auto px-2"></div>

  </main>

  <!-- ===== BOTTOM ACTION BAR ===== -->
  <footer class="fixed bottom-0 inset-x-0 z-20 bg-white/80 backdrop-blur-md border-t-4 border-purple-200 py-3 px-4 flex justify-center gap-3">
    <button id="btnStart"
      class="btn-fun bg-gradient-to-br from-green-400 to-green-600 hover:from-green-500 hover:to-green-700 text-white font-extrabold py-3 px-8 rounded-full shadow-lg text-lg transition border-2 border-green-300">
      ▶️ Start Game
    </button>
    <button id="btnPause"
      class="btn-fun hidden bg-gradient-to-br from-yellow-400 to-yellow-600 hover:from-yellow-500 hover:to-yellow-700 text-white font-extrabold py-3 px-8 rounded-full shadow-lg text-lg transition border-2 border-yellow-300">
      ⏸️ Pause
    </button>
    <button id="btnReset"
      class="btn-fun hidden bg-gradient-to-br from-red-400 to-red-600 hover:from-red-500 hover:to-red-700 text-white font-extrabold py-3 px-8 rounded-full shadow-lg text-lg transition border-2 border-red-300">
      🔄 Reset
    </button>
  </footer>

  <!-- ===== GAME OVER MODAL ===== -->
  <div id="gameOverModal"
    class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
    <div class="modal-bounce bg-white rounded-[2rem] shadow-2xl p-8 md:p-10 text-center max-w-md w-full border-4 border-purple-200">

      <div class="text-7xl md:text-8xl mb-4 float">🎉</div>
      <h2 class="title-font text-3xl md:text-4xl font-extrabold text-purple-700 mb-1">Great Job!</h2>
      <p class="text-gray-500 mb-6 font-medium" id="modalMessage">You caught letters!</p>

      <div class="bg-gradient-to-br from-purple-100 to-pink-100 rounded-2xl py-5 mb-3 border-2 border-purple-200">
        <p class="text-xs uppercase tracking-widest text-purple-500 font-bold mb-1">Your Score</p>
        <p class="text-5xl md:text-6xl font-extrabold text-purple-700" id="finalScore">0</p>
      </div>

      <div class="grid grid-cols-2 gap-3 mb-6">
        <div class="bg-orange-50 rounded-xl py-3 border-2 border-orange-200">
          <p class="text-[10px] uppercase tracking-widest text-orange-500 font-bold">Best Combo</p>
          <p class="text-2xl font-extrabold text-orange-600"><span id="finalCombo">0</span>🔥</p>
        </div>
        <div class="bg-purple-50 rounded-xl py-3 border-2 border-purple-200">
          <p class="text-[10px] uppercase tracking-widest text-purple-500 font-bold">High Score</p>
          <p class="text-2xl font-extrabold text-purple-700">
            <span id="finalHighScore">0</span>
            <span id="newRecordBadge"
                  class="hidden ml-1 text-[10px] bg-yellow-400 text-yellow-900 px-2 py-0.5 rounded-full align-middle">
              🏆 NEW!
            </span>
          </p>
        </div>
      </div>

      <button id="btnPlayAgain"
        class="btn-fun bg-gradient-to-br from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 text-white font-extrabold py-3 px-8 rounded-full shadow-lg text-lg transition border-2 border-purple-300 w-full">
        🔁 Play Again
      </button>
    </div>
  </div>

  <!-- ===== DJANGO VALUES FOR JS ===== -->
  <script>
    window.LETTER_PLAY = {
      username:  "{{ player_username|default:''|escapejs }}",
      userId:    {{ player_id|default:"null" }},
      scoreUrl:  "{{ score_endpoint|default:''|escapejs }}",
      csrfToken: "{{ csrf_token }}",
    };
  </script>

  <!-- ===== GAME LOGIC (external) ===== -->
  <script src="{% static 'accounts/js/letter_play.js' %}"></script>
</body>
</html>
